<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ede6d7">
  <title>FUDE — 毛筆</title>
  <style>
    :root { background: #ede6d7; color: #252019; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    body { font-family: ui-serif, "Hiragino Mincho ProN", "Yu Mincho", serif; background: radial-gradient(ellipse at 25% 15%, #faf5e9, #e6dece); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #notice { position: fixed; left: 50%; top: env(safe-area-inset-top, 0px); transform: translateX(-50%); width: max-content; max-width: 90vw; padding: 9px 14px; border-radius: 0 0 12px 12px; background: rgba(38,31,23,.78); color: #fffaf0; font-size: 12px; letter-spacing: .08em; text-align: center; pointer-events: none; transition: opacity .5s; }
    #notice.hide { opacity: 0; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 4; align-items: center; justify-content: center; background: #e9e1d2; color: #302820; font-size: 16px; text-align: center; line-height: 2; }
    @media (orientation: landscape) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="paper" aria-label="毛筆で描くキャンバス"></canvas>
  <div id="notice">筆先を置いてください</div>
  <div id="rotate">縦向きにしてから<br>毛筆をお使いください</div>
  <script>
  (() => {
    'use strict';
    const canvas = document.querySelector('#paper');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const notice = document.querySelector('#notice');
    const HAIR_COUNT = 2000;
    const ink = '#171310';
    let dpr = 1, active = null, clearTimer = 0, messageTimer = 0;

    // A fixed, tapered bundle: center hairs are longest; perimeter hairs are short.
    const hairs = Array.from({ length: HAIR_COUNT }, (_, i) => {
      const a = i * 2.399963229728653; // golden angle: evenly fills the circular root
      const r = Math.sqrt((i + .5) / HAIR_COUNT);
      const edge = Math.pow(r, 1.7);
      // 微妙な長短と強さの違いが、含み墨を持った濡れた毛先の輪郭を作る。
      const variation = .93 + (((Math.sin(i * 78.233) * 43758.5453) % 1 + 1) % 1) * .14;
      return {
        x: Math.cos(a) * r,
        y: Math.sin(a) * r,
        length: (.42 + .58 * Math.pow(1 - r, .68)) * variation,
        stiffness: .28 + .72 * Math.pow(1 - r, .45),
        grain: variation
      };
    });

    function fit() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(innerWidth * dpr);
      canvas.height = Math.round(innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#f4eddf';
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    fit();
    addEventListener('resize', fit, { passive: true });

    function say(text, time = 1800) {
      notice.textContent = text;
      notice.classList.remove('hide');
      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => notice.classList.add('hide'), time);
    }

    // width / height exist for PointerEvents, but a 1px point is not a physical brush contact.
    // This deliberately makes mouse input inert; mobile drawing starts only with usable contact geometry.
    function contactSize(e) {
      const w = Number(e.width), h = Number(e.height);
      if (!Number.isFinite(w) || !Number.isFinite(h) || w <= 1.25 || h <= 1.25) return null;
      return Math.sqrt(w * h);
    }
    function isClearCorner(e) { return e.clientX >= innerWidth - 37.8 && e.clientY <= 37.8; } // 1cm CSS
    function cancelClear() { if (clearTimer) { clearTimeout(clearTimer); clearTimer = 0; } }
    function clearPaper() {
      ctx.fillStyle = '#f4eddf'; ctx.fillRect(0, 0, innerWidth, innerHeight);
      say('紙を新しくしました');
    }

    function makeSample(e, size, previous) {
      const x = e.clientX, y = e.clientY;
      const dx = previous ? x - previous.x : 0;
      const dy = previous ? y - previous.y : 0;
      const speed = Math.hypot(dx, dy);
      const ux = speed > .15 ? dx / speed : (previous?.ux ?? 1);
      const uy = speed > .15 ? dy / speed : (previous?.uy ?? 0);
      return { x, y, size, ux, uy, speed };
    }

    function bristleTip(sample, hair, depression, state) {
      // Root fans out under compression.  The local y axis rotates with the stroke direction.
      const sideX = -sample.uy, sideY = sample.ux;
      // The footprint is not a circular stamp.  Compression keeps the requested
      // 1.5x width, but extends much farther along travel.  The leading half is
      // narrowed, creating the pointed, raindrop-shaped brush footprint.
      const sideSpread = 5.25 + 42 * depression;
      const travelSpread = 7 + 70 * depression;
      const lead = Math.max(0, Math.min(1, (hair.y + 1) * .5));
      const leadTaper = .42 + .58 * (1 - lead);
      const radialLength = .22 + .78 * hair.length;
      const rootSide = hair.x * sideSpread * radialLength * leadTaper;
      const rootTravel = hair.y * travelSpread * radialLength;
      const rx = sideX * rootSide + sample.ux * rootTravel;
      const ry = sideY * rootSide + sample.uy * rootTravel;

      // The pressed shaft bends backward (opposite travel); long central hairs bend farther.
      // A tiny radial term makes individual hairs peel away in three dimensions, not as a flat stamp.
      const bend = depression * (12 + 52 * hair.length) * (1.18 - .55 * hair.stiffness);
      const liftProjection = depression * hair.length * 8;
      const peel = (1 - depression) * 2.5 + hair.x * liftProjection;
      return {
        // state.escape is a delayed force vector.  At a corner it retains the
        // previous bend for a moment, so the hair tip naturally takes a small arc.
        x: sample.x + rx + state.escapeX * bend + sideX * peel,
        y: sample.y + ry + state.escapeY * bend + sideY * peel
      };
    }

    function drawSegment(before, after, state) {
      state.minSize = Math.min(state.minSize, after.size);
      // The pressure coefficient uses only event.width / event.height.  It combines
      // their absolute contact area with change from the lightest touch in this stroke.
      // Do not saturate at ordinary finger-contact sizes.  These ranges make a
      // 5px light touch, 20px normal touch, and 40px hard press visibly distinct.
      const absolute = Math.max(0, Math.min(1, (after.size - 2) / 42));
      const relative = Math.max(0, Math.min(1, (after.size - state.minSize) / Math.max(1.1, state.minSize * .10)));
      const depression = Math.max(.025, Math.pow(Math.max(absolute, relative), .62));
      const distance = Math.max(1, Math.hypot(after.x - before.x, after.y - before.y));
      const repeats = Math.min(4, Math.max(1, Math.ceil(distance / 5)));
      for (let step = 1; step <= repeats; step++) {
        const t = step / repeats;
        const oldT = (step - 1) / repeats;
        const a = { x: before.x + (after.x - before.x) * oldT, y: before.y + (after.y - before.y) * oldT, size: before.size + (after.size - before.size) * oldT, ux: after.ux, uy: after.uy };
        const b = { x: before.x + (after.x - before.x) * t, y: before.y + (after.y - before.y) * t, size: before.size + (after.size - before.size) * t, ux: after.ux, uy: after.uy };
        // A compressed brush bends more and returns more slowly: this is the
        // source of the characteristic "go around the corner" behaviour.
        const follow = .42 - depression * .24;
        state.escapeX += (-b.ux - state.escapeX) * follow;
        state.escapeY += (-b.uy - state.escapeY) * follow;
        ctx.beginPath();
        for (const hair of hairs) {
          const p = bristleTip(a, hair, depression, state);
          const q = bristleTip(b, hair, depression, state);
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
        }
        ctx.strokeStyle = ink;
        // Loaded ink: every bristle is fully opaque.  Darkness never changes with pressure.
        ctx.globalAlpha = 1;
        ctx.lineWidth = .38 + depression * .63;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    canvas.addEventListener('pointerdown', e => {
      if (matchMedia('(orientation: landscape)').matches) return;
      if (isClearCorner(e)) {
        clearTimer = setTimeout(() => {
          clearTimer = 0;
          if (confirm('紙をすべて消しますか？')) clearPaper();
        }, 700);
        return;
      }
      const size = contactSize(e);
      if (size === null || (e.pointerType !== 'touch' && e.pointerType !== 'pen')) {
        say('接触面の幅・高さを取得できる端末でお使いください', 2600);
        return;
      }
      canvas.setPointerCapture(e.pointerId);
      const now = makeSample(e, size, null);
      active = {
        id: e.pointerId,
        minSize: size,
        // At rest, all hairs initially lean backwards from the first movement.
        escapeX: -now.ux,
        escapeY: -now.uy,
        last: now
      };
      say('筆を運んでください', 850);
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('pointermove', e => {
      if (clearTimer) { if (!isClearCorner(e)) cancelClear(); return; }
      if (!active || active.id !== e.pointerId) return;
      const size = contactSize(e);
      if (size === null) return;
      const now = makeSample(e, size, active.last);
      drawSegment(active.last, now, active);
      active.last = now;
      e.preventDefault();
    }, { passive: false });

    function finish(e) {
      cancelClear();
      if (active?.id === e.pointerId) active = null;
    }
    canvas.addEventListener('pointerup', finish);
    canvas.addEventListener('pointercancel', finish);
    canvas.addEventListener('contextmenu', e => e.preventDefault());
  })();
  </script>
</body>
</html>
