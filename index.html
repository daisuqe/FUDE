<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ede6d7">
  <title>FUDE — 物理毛筆</title>
  <style>
    :root { background: #ede6d7; color: #252019; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    body { font-family: ui-serif, "Hiragino Mincho ProN", "Yu Mincho", serif; background: radial-gradient(ellipse at 25% 15%, #faf5e9, #e6dece); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #notice { position: fixed; left: 50%; top: env(safe-area-inset-top, 0px); transform: translateX(-50%); width: max-content; max-width: 90vw; padding: 9px 14px; border-radius: 0 0 12px 12px; background: rgba(38,31,23,.78); color: #fffaf0; font-size: 12px; letter-spacing: .08em; text-align: center; pointer-events: none; transition: opacity .5s; }
    #notice.hide { opacity: 0; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 4; align-items: center; justify-content: center; background: #e9e1d2; color: #302820; font-size: 16px; text-align: center; line-height: 2; }
    @media (orientation: landscape) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="paper" aria-label="物理シミュレーション毛筆キャンバス"></canvas>
  <div id="notice">筆先を置いてください</div>
  <div id="rotate">縦向きにしてから<br>毛筆をお使いください</div>
  <script>
  (() => {
    'use strict';
    const canvas = document.querySelector('#paper');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const notice = document.querySelector('#notice');
    const HAIR_COUNT = 500;
    const NODES = 5;                 // 根元 + 4節。各節を3Dで計算する。
    const PARTICLES = HAIR_COUNT * NODES;
    const PAPER_Z = 0;
    const ink = '#100c09';
    const LENGTH_SCALE = .7;
    const ROOT_RADIUS = 20;          // 以前の2倍: 描画される筆幅も2倍。
    const HAIR_STROKE_WIDTH = 1.28;
    const ROOT_CONTACT_Z = 7;        // The ferrule-side roots are now wetting the paper.
    const TILT_ANGLE = 30 * Math.PI / 180;
    const TILT_SIN = Math.sin(TILT_ANGLE), TILT_COS = Math.cos(TILT_ANGLE), TILT_TAN = Math.tan(TILT_ANGLE);
    let dpr = 1, activePointer = null, clearTimer = 0, messageTimer = 0;

    // Reproducible randomness: natural-looking placement without changing between runs.
    const randomAt = (index, salt) => {
      const value = Math.sin((index + 1) * 127.1 + salt * 311.7) * 43758.5453123;
      return value - Math.floor(value);
    };

    // Position and previous-position pairs form a Verlet 3D particle system.
    const px = new Float32Array(PARTICLES), py = new Float32Array(PARTICLES), pz = new Float32Array(PARTICLES);
    const ox = new Float32Array(PARTICLES), oy = new Float32Array(PARTICLES), oz = new Float32Array(PARTICLES);
    const lastInkX = new Float32Array(HAIR_COUNT), lastInkY = new Float32Array(HAIR_COUNT);
    const wasWet = new Uint8Array(HAIR_COUNT);
    const anchorX = new Float32Array(HAIR_COUNT), anchorY = new Float32Array(HAIR_COUNT);
    const tipAnchored = new Uint8Array(HAIR_COUNT);
    const hairs = Array.from({ length: HAIR_COUNT }, (_, i) => {
      // Deliberately random root positions make the individual fibres visible,
      // unlike a mathematically even spiral distribution.
      const angle = randomAt(i, 1) * Math.PI * 2;
      const radius = Math.sqrt(randomAt(i, 2));
      const individuality = .90 + randomAt(i, 3) * .20; // ±10% per fibre
      // No random length variation: build a clean, conventional rounded brush first.
      // Only the central fibres are longest; length decreases smoothly to the rim.
      const center = Math.pow(1 - radius, .72);
      return {
        rootX: Math.cos(angle) * radius * ROOT_RADIUS,
        rootY: Math.sin(angle) * radius * ROOT_RADIUS,
        // A pointed brush: long compliant central hairs, short firmer outside hairs.
        length: (42 + 76 * center) * LENGTH_SCALE,
        segment: (42 + 76 * center) * LENGTH_SCALE / (NODES - 1),
        // Slight individual differences prevent all hairs from bending in lockstep.
        damping: Math.min(.74, (.58 + .08 * center) * individuality),
        gravity: .30 * individuality,
        bendStiffness: Math.min(.38, .30 * individuality),
        // Very small tangential velocity after paper collision = a tip that stays put.
        slip: (.002 + .012 * center) / individuality
      };
    });
    // Liquid bridges link nearby hairs.  Links have a slack limit rather than a
    // rigid length, so normal strokes stay together and hard presses can fan out.
    const liquidLinks = (() => {
      const keys = new Set();
      for (let a = 0; a < HAIR_COUNT; a++) {
        let first = -1, second = -1, third = -1, firstD = Infinity, secondD = Infinity, thirdD = Infinity;
        for (let b = 0; b < HAIR_COUNT; b++) {
          if (a === b) continue;
          const dx = hairs[a].rootX - hairs[b].rootX, dy = hairs[a].rootY - hairs[b].rootY;
          const distanceSq = dx * dx + dy * dy;
          if (distanceSq < firstD) {
            third = second; thirdD = secondD; second = first; secondD = firstD; first = b; firstD = distanceSq;
          } else if (distanceSq < secondD) {
            third = second; thirdD = secondD; second = b; secondD = distanceSq;
          } else if (distanceSq < thirdD) { third = b; thirdD = distanceSq; }
        }
        for (const b of [first, second, third]) if (b >= 0) keys.add(`${Math.min(a, b)}:${Math.max(a, b)}`);
      }
      return [...keys].map(key => {
        const [a, b] = key.split(':').map(Number);
        return { a, b, rest: Math.hypot(hairs[a].rootX - hairs[b].rootX, hairs[a].rootY - hairs[b].rootY) };
      });
    })();
    const brush = {
      active: false, drawEnabled: false, x: 0, y: 0, pressure: 0,
      rootZ: 112 * LENGTH_SCALE, minSize: 0, nativePressureSeen: false,
      inputX: 0, inputY: 0, inputTime: 0, dirX: 0, dirY: -1, hasDirection: false,
      sensorPressure: 0, startedAt: 0, releasing: false, releaseStartedAt: 0,
      lastMoveX: 0, lastMoveY: 1, turnStrength: 0
    };

    function fit() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#f4eddf'; ctx.fillRect(0, 0, innerWidth, innerHeight);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    }
    fit();
    addEventListener('resize', fit, { passive: true });

    function say(text, time = 1800) {
      notice.textContent = text; notice.classList.remove('hide');
      clearTimeout(messageTimer); messageTimer = setTimeout(() => notice.classList.add('hide'), time);
    }
    function clearPaper() { ctx.fillStyle = '#f4eddf'; ctx.fillRect(0, 0, innerWidth, innerHeight); say('紙を新しくしました'); }
    function contactSize(e) {
      const w = Number(e.width), h = Number(e.height);
      if (!Number.isFinite(w) || !Number.isFinite(h) || w <= 1.25 || h <= 1.25) return null;
      return Math.sqrt(w * h);
    }
    function isClearCorner(e) { return e.clientX >= innerWidth - 37.8 && e.clientY <= 37.8; }
    function cancelClear() { if (clearTimer) { clearTimeout(clearTimer); clearTimer = 0; } }

    // event.pressure wins when the device reports a real changing value.  A fixed
    // 0.5 is the PointerEvent fallback for many touch screens, so it is not trusted.
    function nativePressure(e) {
      const pressure = Number(e.pressure);
      if (!Number.isFinite(pressure) || pressure <= 0 || pressure > 1) return null;
      if (e.pointerType === 'pen') return pressure;
      if (pressure !== .5) brush.nativePressureSeen = true;
      return brush.nativePressureSeen ? pressure : null;
    }
    // Width and height are used when the device does not expose usable pressure.
    function pressureFromContact(e, size) {
      const suppliedPressure = nativePressure(e);
      brush.minSize = Math.min(brush.minSize, size);
      const absolute = Math.max(0, Math.min(1, (size - 2) / 24));
      const relative = Math.max(0, Math.min(1, (size - brush.minSize) / Math.max(1.1, brush.minSize * .10)));
      const areaPressure = Math.max(absolute, relative);
      // Use a lower-biased average instead of a hard minimum.  It still responds
      // when either signal weakens, but one noisy sensor no longer makes the entry
      // of a stroke collapse to an unnaturally thin line.
      const combinedPressure = suppliedPressure === null
        ? areaPressure
        : Math.min(suppliedPressure, areaPressure) * .60 + Math.max(suppliedPressure, areaPressure) * .40;
      const normalized = Math.max(0, Math.min(1, (combinedPressure - .10) / .80));
      return Math.max(.008, Math.pow(normalized, 1.65));
    }
    function rootPosition(hair, x, y, z) {
      // Root plane is perpendicular to the 30°-tilted brush axis.
      const forwardOffset = hair.rootX * brush.dirX + hair.rootY * brush.dirY;
      return { x: x + hair.rootX, y: y + hair.rootY, z: z - forwardOffset * TILT_TAN };
    }

    function resetBristles() {
      // On placement fibres are vertical.  Movement thereafter is not faked:
      // paper friction and the moving root determine bend direction.
      for (let h = 0; h < HAIR_COUNT; h++) {
        const hair = hairs[h], root = rootPosition(hair, brush.x, brush.y, brush.rootZ), start = h * NODES;
        for (let n = 0; n < NODES; n++) {
          const t = n / (NODES - 1);
          // Root-to-tip direction is back and down: the handle leans 30° forward.
          const naturalX = root.x - brush.dirX * TILT_SIN * hair.length * t;
          const naturalY = root.y - brush.dirY * TILT_SIN * hair.length * t;
          const naturalZ = root.z - TILT_COS * hair.length * t;
          const j = start + n;
          // A stationary press must not arbitrarily choose a radial escape route.
          // Fibres begin vertically beneath their own roots.  Only a later handle
          // movement supplies a horizontal force, so the ensuing bend has the
          // physically correct, opposite-to-travel direction rather than a ring.
          px[j] = ox[j] = naturalX;
          py[j] = oy[j] = naturalY;
          pz[j] = oz[j] = Math.max(PAPER_Z, naturalZ);
        }
        wasWet[h] = 0;
        tipAnchored[h] = 0;
      }
    }

    function pinRoots() {
      for (let h = 0; h < HAIR_COUNT; h++) {
        const hair = hairs[h], root = rootPosition(hair, brush.x, brush.y, brush.rootZ), j = h * NODES;
        px[j] = ox[j] = root.x; py[j] = oy[j] = root.y; pz[j] = oz[j] = root.z;
      }
    }
    function integrate() {
      for (let h = 0; h < HAIR_COUNT; h++) {
        const hair = hairs[h], start = h * NODES;
        for (let n = 1; n < NODES; n++) {
          const j = start + n;
          const vx = (px[j] - ox[j]) * hair.damping;
          const vy = (py[j] - oy[j]) * hair.damping;
          const vz = (pz[j] - oz[j]) * hair.damping - hair.gravity; // gravity toward the paper
          ox[j] = px[j]; oy[j] = py[j]; oz[j] = pz[j];
          px[j] += vx; py[j] += vy; pz[j] += vz;
        }
      }
    }
    function solveConstraints() {
      // Four passes preserve each hair's segment lengths while the root moves.
      for (let pass = 0; pass < 4; pass++) {
        pinRoots();
        for (let h = 0; h < HAIR_COUNT; h++) {
          const hair = hairs[h], start = h * NODES;
          for (let n = 0; n < NODES - 1; n++) {
            const a = start + n, b = a + 1;
            const dx = px[b] - px[a], dy = py[b] - py[a], dz = pz[b] - pz[a];
            const distance = Math.hypot(dx, dy, dz) || .0001;
            const correction = (distance - hair.segment) / distance;
            if (n === 0) {
              px[b] -= dx * correction; py[b] -= dy * correction; pz[b] -= dz * correction;
            } else {
              px[a] += dx * correction * .5; py[a] += dy * correction * .5; pz[a] += dz * correction * .5;
              px[b] -= dx * correction * .5; py[b] -= dy * correction * .5; pz[b] -= dz * correction * .5;
            }
          }
          // A second-neighbour constraint is bending rigidity: it makes each
          // pair of segments favour a straight line, rather than a loose chain.
          for (let n = 0; n < NODES - 2; n++) {
            const a = start + n, c = a + 2;
            const dx = px[c] - px[a], dy = py[c] - py[a], dz = pz[c] - pz[a];
            const distance = Math.hypot(dx, dy, dz) || .0001;
            const correction = (distance - hair.segment * 2) / distance * hair.bendStiffness;
            // The bundle stays coherent in depth, but each fibre is supple in the
            // paper plane (left/right and fore/aft) like a wet, soft brush.
            const planarCorrection = correction * .30;
            if (n === 0) {
              px[c] -= dx * planarCorrection; py[c] -= dy * planarCorrection; pz[c] -= dz * correction;
            } else {
              px[a] += dx * planarCorrection * .5; py[a] += dy * planarCorrection * .5; pz[a] += dz * correction * .5;
              px[c] -= dx * planarCorrection * .5; py[c] -= dy * planarCorrection * .5; pz[c] -= dz * correction * .5;
            }
          }
        }
        // Paper collision with high tangential friction is what makes tips trail
        // behind the moving root instead of imposing an artificial raindrop shape.
        for (let h = 0; h < HAIR_COUNT; h++) {
          const hair = hairs[h], start = h * NODES;
          for (let n = 1; n < NODES; n++) {
            const j = start + n;
            if (pz[j] < PAPER_Z) {
              pz[j] = PAPER_Z;
              ox[j] = px[j] - (px[j] - ox[j]) * hair.slip;
              oy[j] = py[j] - (py[j] - oy[j]) * hair.slip;
              oz[j] = pz[j];
              if (n === NODES - 1 && !tipAnchored[h]) {
                anchorX[h] = px[j]; anchorY[h] = py[j]; tipAnchored[h] = 1;
              }
            }
          }
        }
        // Surface-tension bridges resist separation between adjacent wet tips.
        // The slack grows only for a deep press, allowing a controlled small splay.
        const liquidSlack = .005 + .15 * brush.pressure * brush.pressure;
        for (const link of liquidLinks) {
          const a = link.a * NODES + NODES - 1, b = link.b * NODES + NODES - 1;
          const dx = px[b] - px[a], dy = py[b] - py[a];
          const distance = Math.hypot(dx, dy) || .0001;
          const limit = link.rest + liquidSlack;
          if (distance > limit) {
            const correction = (distance - limit) / distance;
            px[a] += dx * correction; py[a] += dy * correction;
            px[b] -= dx * correction; py[b] -= dy * correction;
          }
        }
        // The handle is tilted forward, so bristles can trail backward but must
        // not curl far to either side.  This is a narrow directional guide, not a
        // drawn shape: root offsets still provide the full brush width.
        const sideX = -brush.dirY, sideY = brush.dirX;
        for (let h = 0; h < HAIR_COUNT; h++) {
          const hair = hairs[h], root = rootPosition(hair, brush.x, brush.y, brush.rootZ), start = h * NODES;
          for (let n = 1; n < NODES; n++) {
            const j = start + n, fraction = n / (NODES - 1);
            const dx = px[j] - root.x, dy = py[j] - root.y;
            const along = dx * brush.dirX + dy * brush.dirY;
            const side = dx * sideX + dy * sideY;
            const sideLimit = (1.0 + 2.2 * brush.pressure) * fraction;
            const guidedAlong = Math.min(along, 0);
            const guidedSide = Math.max(-sideLimit, Math.min(sideLimit, side));
            if (guidedAlong !== along || guidedSide !== side) {
              px[j] = root.x + brush.dirX * guidedAlong + sideX * guidedSide;
              py[j] = root.y + brush.dirY * guidedAlong + sideY * guidedSide;
              // Remove the lateral Verlet velocity that would otherwise create a loop next pass.
              ox[j] = px[j]; oy[j] = py[j];
            }
          }
        }
        // Static friction: a wet tip initially pins to its first paper contact.
        // Only sustained bending beyond this small yield limit lets the anchor creep.
        for (let h = 0; h < HAIR_COUNT; h++) {
          const tip = h * NODES + NODES - 1;
          if (pz[tip] > PAPER_Z + .08) { tipAnchored[h] = 0; continue; }
          if (!tipAnchored[h]) { anchorX[h] = px[tip]; anchorY[h] = py[tip]; tipAnchored[h] = 1; }
          const dx = px[tip] - anchorX[h], dy = py[tip] - anchorY[h];
          const distance = Math.hypot(dx, dy);
          const yieldDistance = .18 + brush.pressure * .85;
          if (distance > yieldDistance) {
            const creep = (distance - yieldDistance) / distance * .018;
            anchorX[h] += dx * creep; anchorY[h] += dy * creep;
            px[tip] = anchorX[h] + dx / distance * yieldDistance;
            py[tip] = anchorY[h] + dy / distance * yieldDistance;
          } else {
            px[tip] = anchorX[h]; py[tip] = anchorY[h];
          }
          // Even at a sharp turn, a tip must never get ahead of the immediately
          // travelling handle.  It may remain behind, but cannot draw a forward hook.
          const root = rootPosition(hairs[h], brush.x, brush.y, brush.rootZ);
          const ahead = (px[tip] - root.x) * brush.lastMoveX + (py[tip] - root.y) * brush.lastMoveY;
          if (ahead > 0) {
            px[tip] -= brush.lastMoveX * ahead; py[tip] -= brush.lastMoveY * ahead;
            anchorX[h] = px[tip]; anchorY[h] = py[tip];
          }
          ox[tip] = px[tip]; oy[tip] = py[tip];
        }
        // Japanese calligraphic turning (転折): the brush is briefly gathered
        // before it is sent in the new direction.  This releases the old-side
        // anchors into a compact, wet bundle instead of leaving dry side trails.
        if (brush.turnStrength > .01) {
          const gather = .30 * brush.turnStrength;
          for (let h = 0; h < HAIR_COUNT; h++) {
            const hair = hairs[h], root = rootPosition(hair, brush.x, brush.y, brush.rootZ), start = h * NODES;
            for (let n = 1; n < NODES; n++) {
              const j = start + n, fraction = n / (NODES - 1);
              const targetX = root.x - brush.lastMoveX * TILT_SIN * hair.length * fraction;
              const targetY = root.y - brush.lastMoveY * TILT_SIN * hair.length * fraction;
              px[j] += (targetX - px[j]) * gather;
              py[j] += (targetY - py[j]) * gather;
              if (n === NODES - 1) {
                anchorX[h] = px[j]; anchorY[h] = py[j]; tipAnchored[h] = 1;
              }
            }
          }
        }
      }
    }
    function depositInk() {
      ctx.beginPath();
      let any = false;
      for (let h = 0; h < HAIR_COUNT; h++) {
        const tip = h * NODES + NODES - 1;
        // When lifting, shorter outer hairs lose vertical support first.  They may
        // still be physically trailing on the paper, but no longer receive enough
        // ink transfer; the long central hairs therefore form a pointed harai.
        const hasVerticalSupport = hairs[h].length >= brush.rootZ - .5;
        if (pz[tip] <= PAPER_Z + .08 && hasVerticalSupport) {
          if (wasWet[h]) {
            const dx = px[tip] - lastInkX[h], dy = py[tip] - lastInkY[h];
            // A zero-length Canvas stroke still paints its round cap as a dot.
            // Do not transfer ink until this individual tip has genuinely moved;
            // otherwise stationary root positions outline the brush as a circle.
            if (dx * dx + dy * dy > .0225) {
              ctx.moveTo(lastInkX[h], lastInkY[h]); ctx.lineTo(px[tip], py[tip]); any = true;
            }
          }
          lastInkX[h] = px[tip]; lastInkY[h] = py[tip]; wasWet[h] = 1;
        } else {
          wasWet[h] = 0;
        }
      }
      if (any) {
        // Fully loaded, wet black ink: density is not tied to pressure.
        ctx.globalAlpha = 1;
        ctx.strokeStyle = ink;
        // 500本へ減らした分、各毛は以前より太く描く。
        // More pressure carries a wetter, slightly wider individual ink thread.
        ctx.lineWidth = HAIR_STROKE_WIDTH * (1 + brush.pressure * .45);
        ctx.stroke();
      }
      // At an extreme press the root-side of the bundle also reaches the wet
      // paper.  Four-times-radius root footprints overlap into one mashed mass.
      if (brush.rootZ <= ROOT_CONTACT_Z) {
        const rootInkRadius = HAIR_STROKE_WIDTH * 1.3; // normal radius (.64) × (4 × .65)
        ctx.beginPath();
        for (let h = 0; h < HAIR_COUNT; h++) {
          const root = h * NODES;
          ctx.moveTo(px[root] + rootInkRadius, py[root]);
          ctx.arc(px[root], py[root], rootInkRadius, 0, Math.PI * 2);
        }
        ctx.fillStyle = ink; ctx.globalAlpha = 1; ctx.fill();
      }
    }
    function simulate() {
      // Two substeps retain bend history even when PointerEvents arrive sparsely.
      for (let step = 0; step < 2; step++) {
        integrate(); solveConstraints();
        // Placing or pressing the brush is simulation only. Ink starts when the
        // handle actually travels, avoiding an initial circular "splash".
        if (brush.drawEnabled) depositInk();
      }
      brush.turnStrength *= .78;
    }
    function setBrushHeight(inputPressure, speed, now = performance.now()) {
      // Pressure/contact area already produce a nonlinear value.  A second curve
      // makes a light touch visibly finer, while speed lifts the whole brush.
      const contactPressure = Math.pow(inputPressure, 1.35);
      // Normal writing speed retains a firm entry; only genuinely fast flicks lift.
      const speedLift = Math.min(.72, Math.max(0, speed - .65) * .32);
      brush.sensorPressure = contactPressure * (1 - speedLift);
      // A deliberate one-second settling makes the start of every stroke soft.
      const entry = Math.max(0, Math.min(1, (now - brush.startedAt) / 1000));
      brush.pressure = brush.sensorPressure * entry;
      brush.rootZ = 116 * (1 - brush.pressure) * LENGTH_SCALE;
    }
    function advancePointerSample(sample) {
      const size = contactSize(sample);
      if (size === null) return;
      const dx = sample.clientX - brush.inputX, dy = sample.clientY - brush.inputY;
      const distance = Math.hypot(dx, dy);
      const elapsed = Math.max(1, sample.timeStamp - brush.inputTime);
      const speed = distance / elapsed; // CSS pixels per millisecond
      const inputPressure = pressureFromContact(sample, size);
      setBrushHeight(inputPressure, speed);
      if (distance > .35) {
        const directionX = dx / distance, directionY = dy / distance;
        if (brush.hasDirection && directionX * brush.lastMoveX + directionY * brush.lastMoveY < .72) {
          brush.turnStrength = 1;
        }
        if (!brush.hasDirection) {
          brush.dirX = directionX; brush.dirY = directionY; brush.hasDirection = true;
          // No ink has been deposited yet, so establish the inclined rest shape now.
          resetBristles();
        } else {
          // A soft viscous bundle changes orientation slowly at a corner.
          brush.dirX += (directionX - brush.dirX) * .075;
          brush.dirY += (directionY - brush.dirY) * .075;
          const length = Math.hypot(brush.dirX, brush.dirY) || 1;
          brush.dirX /= length; brush.dirY /= length;
        }
        brush.lastMoveX = directionX; brush.lastMoveY = directionY;
        brush.drawEnabled = true;
      }

      // Fill sparse PointerEvents with physical substeps, rather than stamping
      // the 500 tips only at event positions during a fast gesture.
      const steps = Math.max(1, Math.ceil(distance / 2.5));
      for (let step = 1; step <= steps; step++) {
        const ratio = step / steps;
        brush.x = brush.inputX + dx * ratio;
        brush.y = brush.inputY + dy * ratio;
        simulate();
      }
      brush.inputX = sample.clientX; brush.inputY = sample.clientY; brush.inputTime = sample.timeStamp;
    }
    function frame(now) {
      if (brush.active) {
        if (brush.releasing) {
          const remaining = Math.max(0, 1 - (now - brush.releaseStartedAt) / 1000);
          if (remaining === 0) {
            brush.active = false; brush.drawEnabled = false; brush.releasing = false;
          } else {
            brush.pressure = brush.sensorPressure * remaining;
            brush.rootZ = 116 * (1 - brush.pressure) * LENGTH_SCALE;
            brush.x += brush.lastMoveX * .34 * remaining;
            brush.y += brush.lastMoveY * .34 * remaining;
            simulate();
          }
        } else {
          simulate();
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    canvas.addEventListener('pointerdown', e => {
      if (matchMedia('(orientation: landscape)').matches) return;
      if (isClearCorner(e)) {
        clearTimer = setTimeout(() => { clearTimer = 0; if (confirm('紙をすべて消しますか？')) clearPaper(); }, 700);
        return;
      }
      const size = contactSize(e);
      if (size === null || (e.pointerType !== 'touch' && e.pointerType !== 'pen')) {
        say('接触面の幅・高さを取得できる端末でお使いください', 2600); return;
      }
      canvas.setPointerCapture(e.pointerId);
      activePointer = e.pointerId;
      brush.x = e.clientX; brush.y = e.clientY; brush.minSize = size; brush.nativePressureSeen = false;
      brush.inputX = e.clientX; brush.inputY = e.clientY; brush.inputTime = e.timeStamp;
      brush.dirX = 0; brush.dirY = -1; brush.hasDirection = false;
      brush.startedAt = performance.now(); brush.releasing = false;
      brush.lastMoveX = 0; brush.lastMoveY = 1;
      brush.turnStrength = 0;
      setBrushHeight(pressureFromContact(e, size), 0);
      brush.active = true; brush.drawEnabled = false; resetBristles();
      say('毛の物理計算で描画中', 1050);
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('pointermove', e => {
      if (clearTimer) { if (!isClearCorner(e)) cancelClear(); return; }
      if (!brush.active || activePointer !== e.pointerId) return;
      const coalesced = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [];
      const packets = coalesced.length ? coalesced : [e];
      for (const packet of packets) advancePointerSample(packet);
      e.preventDefault();
    }, { passive: false });
    function endPointer(e) {
      cancelClear();
      if (activePointer === e.pointerId) {
        activePointer = null;
        if (e.type === 'pointerup' && brush.drawEnabled) {
          brush.releasing = true; brush.releaseStartedAt = performance.now();
        } else {
          brush.active = false; brush.drawEnabled = false;
        }
      }
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('contextmenu', e => e.preventDefault());
  })();
  </script>
</body>
