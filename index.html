<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ede6d7">
  <title>FUDE</title>
  <style>
    :root { background: #ede6d7; color: #252019; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    body { font-family: ui-serif, "Hiragino Mincho ProN", "Yu Mincho", serif; background: radial-gradient(ellipse at 25% 15%, #faf5e9, #e6dece); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #notice { position: fixed; left: 50%; top: env(safe-area-inset-top, 0px); transform: translateX(-50%); width: max-content; max-width: 90vw; padding: 9px 14px; border-radius: 0 0 12px 12px; background: rgba(38,31,23,.78); color: #fffaf0; font-size: 12px; letter-spacing: .08em; text-align: center; pointer-events: none; transition: opacity .5s; }
    #notice.hide { opacity: 0; }
    /* 診断パネル: 位置・幅・列を固定。ラベル列と値列を分け、値は等幅で右揃えにして、桁が変わっても動かない。 */
    #contact-info { position: fixed; z-index: 3; left: 8px; top: calc(env(safe-area-inset-top, 0px) + 8px); width: 15.5em; display: grid; grid-template-columns: 4.8em 1fr; gap: 3px 6px; padding: 10px 12px; border-radius: 10px; background: rgba(28,22,16,.86); color: #fffaf0; font-size: 16px; line-height: 1.45; pointer-events: none; }
    #contact-info span { font-weight: 700; opacity: .8; }
    #contact-info b { font: 700 17px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; text-align: right; white-space: pre; }
    #contact-info[hidden] { display: none; }
    #settings { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 10px; width: min(310px, calc(100vw - 20px)); padding: 16px 16px 14px; border: 1px solid rgba(50,39,27,.22); border-radius: 14px; background: rgba(247,240,226,.97); box-shadow: 0 10px 35px rgba(38,29,20,.25); touch-action: none; }
    #settings[hidden] { display: none; }
    .settings-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-weight: 700; letter-spacing: .12em; }
    #settings-close { width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(40,31,22,.09); color: #2e261e; font-size: 22px; line-height: 1; }
    .settings-section { margin: 12px 0 15px; }
    .settings-section h2 { margin: 0 0 7px; font-size: 14px; font-weight: 700; }
    .balance-row { display: grid; grid-template-columns: auto minmax(80px, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; }
    .single-row { display: grid; grid-template-columns: 4.5em minmax(80px, 1fr); gap: 8px; align-items: center; margin-top: 12px; font-size: 13px; font-weight: 700; }
    .angle-control { display: grid; gap: 1px; }
    .range-ends { display: flex; justify-content: space-between; color: #746657; font-size: 10px; font-weight: 400; }
    .check-row { display: flex; align-items: center; gap: 9px; margin-top: 14px; font-size: 13px; font-weight: 700; }
    .check-row input { width: 20px; height: 20px; accent-color: #34271c; }
    .settings-note { margin: 7px 0 0; color: #6f6252; font-size: 11px; line-height: 1.65; }
    #settings input[type="range"] { width: 100%; accent-color: #34271c; touch-action: pan-x; }
    #blank-paper, #reset-contact { width: 100%; margin-top: 7px; padding: 11px; border: 1px solid rgba(50,39,27,.3); border-radius: 9px; background: #fffaf0; color: #2e261e; font: inherit; font-weight: 700; }
    #waiting { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(17,14,11,.62); color: #fffaf0; font-size: 22px; font-weight: 700; letter-spacing: .3em; }
    #waiting[hidden] { display: none; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 4; align-items: center; justify-content: center; background: #e9e1d2; color: #302820; font-size: 16px; text-align: center; line-height: 2; }
    @media (orientation: landscape) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="paper" aria-label="物理シミュレーション毛筆キャンバス"></canvas>
  <div id="notice">筆先を置いてください</div>
  <div id="contact-info" aria-hidden="true" hidden>
    <span>幅×高</span><b>-</b>
    <span>接触</span><b>-</b>
    <span>範囲</span><b>-</b>
    <span>面積圧</span><b>-</b>
    <span>筆圧</span><b>-</b>
    <span>sensor</span><b>-</b>
  </div>
  <section id="settings" aria-label="筆設定" hidden>
    <div class="settings-head"><span>筆設定</span><button id="settings-close" type="button" aria-label="設定を閉じる">×</button></div>
    <div class="settings-section">
      <h2>書き始め</h2>
      <label class="balance-row"><span>筆圧</span><input id="start-balance" type="range" min="0" max="100" value="100"><span>押半径</span></label>
    </div>
    <div class="settings-section">
      <h2>書き中</h2>
      <label class="balance-row"><span>筆圧</span><input id="write-balance" type="range" min="0" max="100" value="30"><span>押半径</span></label>
      <label class="single-row"><span>太さ</span><input id="thickness" type="range" min="0" max="100" value="50"></label>
      <label class="single-row"><span>早細さ</span><input id="speed-thinness" type="range" min="0" max="100" value="85"></label>
      <label class="single-row"><span>筆角度</span><span class="angle-control"><input id="brush-angle" type="range" min="0" max="90" value="25"><span class="range-ends"><span>0° 垂直</span><span>90° 進行方向</span></span></span></label>
      <label class="single-row"><span>ハライ</span><span class="angle-control"><input id="harai-duration" type="range" min="0" max="100" value="30"><span class="range-ends"><span>0秒</span><span>1秒</span></span></span></label>
      <label class="check-row"><input id="final-recompute" type="checkbox" checked><span>最後に再計算</span></label>
      <p class="settings-note">オンは指を離した後に全画を毛の物理で清書します。オフはライブ描画をそのまま確定するため、ハライはオンの時だけ効きます。</p>
    </div>
    <div class="settings-section">
      <h2>診断</h2>
      <label class="check-row"><input id="show-contact" type="checkbox"><span>接触情報を表示</span></label>
      <p class="settings-note">書いている間、端末が報告する接触幅・高さと、そこから計算した筆圧を画面上部に出します。</p>
      <button id="reset-contact" type="button">筆圧レンジを初期化</button>
      <p class="settings-note">接触サイズの軽い端・強い端は書きながら自動で覚えます。覚えた範囲を捨てて取り直す時に押します。</p>
    </div>
    <button id="blank-paper" type="button">白紙</button>
  </section>
  <div id="waiting" role="status" aria-live="polite" hidden>待機</div>
  <div id="rotate">縦向きにしてから<br>毛筆をお使いください</div>
  <script>
  (() => {
    'use strict';
    const canvas = document.querySelector('#paper');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const notice = document.querySelector('#notice');
    const settingsPanel = document.querySelector('#settings');
    const waitingOverlay = document.querySelector('#waiting');
    const contactInfo = document.querySelector('#contact-info');
    const contactCells = [...contactInfo.querySelectorAll('b')];
    const HAIR_COUNT = 250;
    const NODES = 5;                 // 根元 + 4節。各節を3Dで計算する。
    const PARTICLES = HAIR_COUNT * NODES;
    const PAPER_Z = 0;
    const ink = '#100c09';
    const LENGTH_SCALE = .7;
    const ROOT_RADIUS = 20;          // 以前の2倍: 描画される筆幅も2倍。
    const HAIR_STROKE_WIDTH = 1.6;   // 毛1本分の墨の太さ。穂先の幅に最低でもこの半分を足す。
    // A harai thins to a hairline, never to nothing: the longest central fibre has to
    // keep touching the paper so a stroke ends in a point instead of stopping dead.
    const HARAI_MIN_PRESSURE = .014;
    const HARAI_MIN_CONTACT = .02;
    // iPhoneで実測した接触サイズ sqrt(width*height) の範囲。最小は約24.3pxの1段階、
    // 強く押すと170px前後まで出る。最初の1サンプルから推定すると、段階値の入力では
    // 推定が外れて固定されるため、実測値を初期値にして観測で外側へ広げるだけにする。
    const DEFAULT_CONTACT_MIN = 24, DEFAULT_CONTACT_MAX = 170;
    // 穂先(濡れた墨の頭)の描き方。
    const INK_SPREAD_PERCENTILE = .97;  // 届く毛の根元の横方向の広がりの何%点を幅にするか(根元は滑らかな分布なので外れ値はない)。
    const INK_SPREAD_GAIN = 1.0;        // その広がりを墨の半径へ換算する係数。
    const INK_ALONG_FOLLOW = .06;       // 毛先の遅れ(進行方向)へ追従する速さ。小さいほど滑らか。
    const INK_SIDE_FOLLOW = .06;        // 横方向の中心へ追従する速さ。小さいほど線がまっすぐ。
    const INK_RADIUS_FOLLOW = .10;      // 物理から求めた半径への追従の速さ(接地本数の増減ならし)。
    // 輪郭の傾きの上限(進んだ距離1pxあたりに半径が増減できる量)。接地本数が増減しても
    // 輪郭にこぶができず、細い穂先から目の形に膨らんで、また細く抜ける。
    const INK_RADIUS_RISE_SLOPE = .20;
    const INK_RADIUS_FALL_SLOPE = .32;
    const INK_MIN_PENETRATION = 3.5;    // 毛が紙へ食い込む深さがこれ未満なら墨を出さない(px)。
    const INK_WET_REACH = 16;           // 毛先がこの高さ(px)までの浮きなら、墨は表面張力で紙とつながる。
    const INK_HANDLE_FOLLOW = .25;      // 指の位置のなだらかさ。指先の検出ノイズで頭が震えないように。
    const INK_HEAD_LAG_SCALE = .85;     // 頭が指から遅れられる距離 = 最長毛 × sin(筆角度) × この値 + 余裕。
    const INK_HEAD_LAG_SLACK = 4;
    const MAX_INK_RADIUS_SCALE = 1.15;  // 半径の上限 = 筆束の半径 × 太さ × この値。
    const MIN_INK_RADIUS = .45;         // 穂先の最小半径(線の太さ0.9px)。
    const MIN_CONTACT_BITE = 6;      // 最軽接触でも中央毛を紙へ食い込ませる深さ。
    const CONTACT_STORE = 'fude.contactRange';
    // iPhone reports width/height in coarse steps (multiples of ~24.3 px), so a
    // press arrives as 24 -> 49 -> 97 -> 170 with nothing in between.  A first-order
    // lag turns each step into a ramp of roughly this duration.
    const CONTACT_SMOOTH_MS = 120;
    let smoothSize = 0, smoothTime = 0;
    let contactMin = DEFAULT_CONTACT_MIN, contactMax = DEFAULT_CONTACT_MAX, showContact = false;
    let dpr = 1, activePointer = null, clearTimer = 0, messageTimer = 0;
    let snapshotValid = false, strokeStart = null, strokeRecords = [], replayingStroke = false;
    let previewX = 0, previewY = 0, previewReady = false, paperReady = false;
    // Committed paper layer.  Copying bitmaps is far cheaper than ImageData: a
    // full-screen getImageData at DPR 2 allocates several megabytes and stalls the
    // main thread at the start of every single stroke.
    const layer = document.createElement('canvas');
    const layerCtx = layer.getContext('2d', { alpha: false });
    function copyCanvasToLayer() {
      if (!canvas.width || !canvas.height) return false;
      if (layer.width !== canvas.width || layer.height !== canvas.height) {
        layer.width = canvas.width; layer.height = canvas.height;
      }
      layerCtx.setTransform(1, 0, 0, 1, 0, 0);
      layerCtx.drawImage(canvas, 0, 0);
      return true;
    }
    function drawLayerToCanvas() {
      // Device pixels 1:1, so this replaces putImageData without touching the
      // DPR transform or the stroke styles the ink renderer relies on.
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(layer, 0, 0);
      ctx.restore();
    }

    // Reproducible randomness: natural-looking placement without changing between runs.
    const randomAt = (index, salt) => {
      const value = Math.sin((index + 1) * 127.1 + salt * 311.7) * 43758.5453123;
      return value - Math.floor(value);
    };

    // Position and previous-position pairs form a Verlet 3D particle system.
    const px = new Float32Array(PARTICLES), py = new Float32Array(PARTICLES), pz = new Float32Array(PARTICLES);
    const ox = new Float32Array(PARTICLES), oy = new Float32Array(PARTICLES), oz = new Float32Array(PARTICLES);
    const anchorX = new Float32Array(HAIR_COUNT), anchorY = new Float32Array(HAIR_COUNT);
    const tipAnchored = new Uint8Array(HAIR_COUNT);
    const hairs = Array.from({ length: HAIR_COUNT }, (_, i) => {
      // Deliberately random root positions make the individual fibres visible,
      // unlike a mathematically even spiral distribution.
      const angle = randomAt(i, 1) * Math.PI * 2;
      const radius = Math.sqrt(randomAt(i, 2));
      const individuality = .90 + randomAt(i, 3) * .20; // ±10% per fibre
      // No random length variation: build a clean, conventional rounded brush first.
      // Only the central fibres are longest; length decreases smoothly to the rim.
      const center = Math.pow(1 - radius, .72);
      return {
        bundleRadius: radius,
        rootX: Math.cos(angle) * radius * ROOT_RADIUS,
        rootY: Math.sin(angle) * radius * ROOT_RADIUS,
        // A pointed brush: long compliant central hairs, short firmer outside hairs.
        length: (42 + 76 * center) * LENGTH_SCALE,
        segment: (42 + 76 * center) * LENGTH_SCALE / (NODES - 1),
        // Slight individual differences prevent all hairs from bending in lockstep.
        damping: Math.min(.74, (.58 + .08 * center) * individuality),
        gravity: .30 * individuality,
        bendStiffness: Math.min(.38, .30 * individuality),
        // Very small tangential velocity after paper collision = a tip that stays put.
        slip: (.002 + .012 * center) / individuality
      };
    });
    const MAX_HAIR_LENGTH = Math.max(...hairs.map(hair => hair.length));
    // Liquid bridges link nearby hairs.  Links have a slack limit rather than a
    // rigid length, so normal strokes stay together and hard presses can fan out.
    const liquidLinks = (() => {
      const keys = new Set();
      for (let a = 0; a < HAIR_COUNT; a++) {
        let first = -1, second = -1, third = -1, firstD = Infinity, secondD = Infinity, thirdD = Infinity;
        for (let b = 0; b < HAIR_COUNT; b++) {
          if (a === b) continue;
          const dx = hairs[a].rootX - hairs[b].rootX, dy = hairs[a].rootY - hairs[b].rootY;
          const distanceSq = dx * dx + dy * dy;
          if (distanceSq < firstD) {
            third = second; thirdD = secondD; second = first; secondD = firstD; first = b; firstD = distanceSq;
          } else if (distanceSq < secondD) {
            third = second; thirdD = secondD; second = b; secondD = distanceSq;
          } else if (distanceSq < thirdD) { third = b; thirdD = distanceSq; }
        }
        for (const b of [first, second, third]) if (b >= 0) keys.add(`${Math.min(a, b)}:${Math.max(a, b)}`);
      }
      return [...keys].map(key => {
        const [a, b] = key.split(':').map(Number);
        return { a, b, rest: Math.hypot(hairs[a].rootX - hairs[b].rootX, hairs[a].rootY - hairs[b].rootY) };
      });
    })();
    const brush = {
      active: false, drawEnabled: false, x: 0, y: 0, pressure: 0,
      rootZ: 112 * LENGTH_SCALE, nativePressureSeen: false,
      inputX: 0, inputY: 0, inputTime: 0, dirX: 0, dirY: -1, hasDirection: false,
      sensorPressure: 0, startedAt: 0, releasing: false,
      lastMoveX: 0, lastMoveY: 1, turnStrength: 0, inkTaper: 1
    };
    const brushSettings = {
      startBalance: 1,
      writeBalance: .30,
      thickness: 1,
      speedThinness: .85,
      haraiDuration: .30,
      finalRecompute: true,
      tiltAngle: 25 * Math.PI / 180,
      tiltSin: Math.sin(25 * Math.PI / 180),
      tiltCos: Math.cos(25 * Math.PI / 180)
    };

    // The calibrated contact range is kept across reloads: recalibrating on every
    // launch would make the first stroke of each session read as a middling press.
    try {
      const saved = JSON.parse(localStorage.getItem(CONTACT_STORE) || 'null');
      if (saved && Number.isFinite(saved.min) && Number.isFinite(saved.max)
        && saved.min > 0 && saved.max > saved.min && saved.max < 400) {
        contactMin = Math.min(DEFAULT_CONTACT_MIN, saved.min);
        contactMax = Math.max(DEFAULT_CONTACT_MAX, saved.max);
      }
    } catch (error) { /* private mode or blocked storage: calibrate from scratch */ }
    function saveContactRange() {
      try { localStorage.setItem(CONTACT_STORE, JSON.stringify({ min: contactMin, max: contactMax })); }
      catch (error) { /* nothing to do: the range just recalibrates next launch */ }
    }
    function bindRange(id, update) {
      const input = document.querySelector(id);
      const apply = () => update(Number(input.value));
      input.addEventListener('input', apply);
      apply();
    }
    bindRange('#start-balance', value => { brushSettings.startBalance = value / 100; });
    bindRange('#write-balance', value => { brushSettings.writeBalance = value / 100; });
    bindRange('#thickness', value => { brushSettings.thickness = .4 + value * .012; });
    bindRange('#speed-thinness', value => { brushSettings.speedThinness = value / 100; });
    bindRange('#brush-angle', value => {
      brushSettings.tiltAngle = value * Math.PI / 180;
      brushSettings.tiltSin = Math.sin(brushSettings.tiltAngle);
      brushSettings.tiltCos = Math.cos(brushSettings.tiltAngle);
    });
    bindRange('#harai-duration', value => { brushSettings.haraiDuration = value / 100; });
    // Read the checkbox at startup exactly as bindRange reads the sliders: browsers
    // restore form state across a reload, so the markup is not a reliable default.
    const recomputeToggle = document.querySelector('#final-recompute');
    const applyRecompute = () => { brushSettings.finalRecompute = recomputeToggle.checked; };
    recomputeToggle.addEventListener('change', applyRecompute);
    applyRecompute();
    const contactToggle = document.querySelector('#show-contact');
    const applyShowContact = () => {
      showContact = contactToggle.checked;
      contactInfo.hidden = !showContact;
      for (const cell of contactCells) cell.textContent = '-';
    };
    contactToggle.addEventListener('change', applyShowContact);
    applyShowContact();
    document.querySelector('#settings-close').addEventListener('click', () => { settingsPanel.hidden = true; });
    document.querySelector('#reset-contact').addEventListener('click', () => {
      contactMin = DEFAULT_CONTACT_MIN; contactMax = DEFAULT_CONTACT_MAX;
      try { localStorage.removeItem(CONTACT_STORE); } catch (error) { /* nothing stored */ }
      say('筆圧レンジを初期化しました。次の一画の接触を基準に取り直します', 2800);
    });
    document.querySelector('#blank-paper').addEventListener('click', () => {
      if (confirm('紙を白紙に戻しますか？')) { clearPaper(); settingsPanel.hidden = true; }
    });

    function fit() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const width = Math.round(innerWidth * dpr), height = Math.round(innerHeight * dpr);
      // iOS shows and hides its address bar during use and fires resize each time.
      // Re-initialising the canvas there used to erase finished calligraphy.
      if (canvas.width === width && canvas.height === height) return;
      const kept = paperReady && copyCanvasToLayer();
      canvas.width = width; canvas.height = height;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#f4eddf'; ctx.fillRect(0, 0, innerWidth, innerHeight);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (kept) drawLayerToCanvas();
      paperReady = true;
      // Recorded coordinates belong to the previous viewport: never replay them.
      discardStrokeHistory();
    }
    fit();
    addEventListener('resize', fit, { passive: true });

    function say(text, time = 1800) {
      notice.textContent = text; notice.classList.remove('hide');
      clearTimeout(messageTimer); messageTimer = setTimeout(() => notice.classList.add('hide'), time);
    }
    function clearPaper() {
      ctx.fillStyle = '#f4eddf'; ctx.fillRect(0, 0, innerWidth, innerHeight);
      snapshotValid = false; strokeStart = null; strokeRecords = [];
      say('紙を新しくしました');
    }
    function contactSize(e) {
      const w = Number(e.width), h = Number(e.height);
      if (!Number.isFinite(w) || !Number.isFinite(h) || w <= 1.25 || h <= 1.25) return null;
      return Math.sqrt(w * h);
    }
    function isClearCorner(e) { return e.clientX >= innerWidth - 56.7 && e.clientY <= 56.7; }
    function cancelClear() { if (clearTimer) { clearTimeout(clearTimer); clearTimer = 0; } }

    // event.pressure wins when the device reports a real changing value.  A fixed
    // 0.5 is the PointerEvent fallback for many touch screens, so it is not trusted.
    function nativePressure(e) {
      const pressure = Number(e.pressure);
      if (!Number.isFinite(pressure) || pressure <= 0 || pressure > 1) return null;
      if (e.pointerType === 'pen') return pressure;
      if (pressure !== .5) brush.nativePressureSeen = true;
      return brush.nativePressureSeen ? pressure : null;
    }
    // Width and height are used when the device does not expose usable pressure.
    function smoothContactSize(size, time, restart) {
      if (restart || !smoothTime) smoothSize = size;
      else {
        const elapsed = Math.max(0, Math.min(250, time - smoothTime));
        smoothSize += (size - smoothSize) * (1 - Math.exp(-elapsed / CONTACT_SMOOTH_MS));
      }
      smoothTime = time;
      return smoothSize;
    }
    function pressureFromContact(e, size, restart = false) {
      const suppliedPressure = nativePressure(e);
      // Calibrate against the contact sizes this finger really produces.  The old
      // fixed 2–26 px window was a stylus range: a fingertip already starts near
      // 25 px, so every touch saturated it and pressing lighter changed nothing.
      // The first sample of the session is assumed to be a middling press; real
      // extremes then widen the range from both ends.
      // The range follows the same smoothed value that is mapped.  Feeding it the raw
      // size made a jump from 49 to 97 widen the range immediately while the smoothed
      // value was still low, so pressing harder briefly read as pressing lighter.
      const eased = smoothContactSize(size, e.timeStamp, restart);
      contactMin = Math.min(contactMin, eased);
      contactMax = Math.max(contactMax, eased);
      // Contact steps are multiplicative (24 -> 49 -> 97 -> 170), so the mapping is
      // logarithmic: each step then adds the same amount of pressure.  A linear map
      // put 49 at 17 % and crushed everything below the firmest press into hairlines.
      const areaPressure = Math.max(0, Math.min(1,
        Math.log(eased / contactMin) / Math.log(Math.max(contactMax, contactMin * 1.5) / contactMin)));
      // 0–1 s: entry setting. 1–2 s: smoothly migrate to the writing setting.

        const taperStartTime = taperIndex <= lastIndex ? replayRecords[taperIndex].time : endTime;
        const taperStartDistance = taperIndex <= lastIndex ? travelled[taperIndex] : endDistance;
        const taperSpanDistance = endDistance - taperStartDistance;
        const taperSpanTime = Math.max(1, endTime - taperStartTime);
        // The width the stroke had immediately before the taper begins.
        const haraiBasePressure = replayRecords[Math.max(0, taperIndex - 1)].pressure;

        let taperCap = 1, directionSeen = false;
        for (let i = 0; i <= lastIndex; i++) {
          const state = replayRecords[i];
          const inHarai = taperDurationMs > 0 && i >= taperIndex;
          let syntheticPressure = null, contactTaper = 1;
          if (inHarai) {
            // Fall back to time only when the finger stood still at the release point.
            const progress = taperSpanDistance > 2
              ? (travelled[i] - taperStartDistance) / taperSpanDistance
              : (state.time - taperStartTime) / taperSpanTime;
            const remaining = Math.max(0, Math.min(1, 1 - progress));
            // Monotone envelope: once a harai starts the bundle may only narrow, so
            // a noisy sensor frame can never push thickness back into the tip.
            taperCap = Math.min(taperCap, Math.max(HARAI_MIN_PRESSURE, Math.pow(remaining, .72)));
            // Never wider than what was really written: the taper can only thin.
            syntheticPressure = Math.min(state.pressure, haraiBasePressure * taperCap);
            contactTaper = Math.max(HARAI_MIN_CONTACT, Math.pow(taperCap, .65));
          }
          applyRecordedState(state, 1, syntheticPressure, contactTaper);
          // The live stroke sets its tilted rest shape the moment the first move gives
          // the brush a direction.  Without the same step here the replay would start
          // from the default upward pose and swing the bundle round into the stroke.
          if (state.hasDirection && !directionSeen) { directionSeen = true; resetBristles(); }
          brush.releasing = inHarai;
          simulate();
        }
      } finally {
        brush.active = false; brush.drawEnabled = false; brush.releasing = false;
        brush.inkTaper = 1;
        replayingStroke = false;
        discardStrokeHistory();
      }
    }
    function discardStrokeHistory() {
      snapshotValid = false; strokeStart = null; strokeRecords = [];
    }
    function calculateFinalStroke(haraiDuration) {
      waitingOverlay.hidden = false;
      document.body.setAttribute('aria-busy', 'true');
      // Give the browser a frame to paint the waiting layer before synchronous
      // physics replay occupies the main thread.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        try {
          redrawRecordedStroke(haraiDuration);
        } finally {
          waitingOverlay.hidden = true;
          document.body.removeAttribute('aria-busy');
        }
      }));
    }
    function drawFastPreview(x, y) {
      if (!brush.drawEnabled) return;
      // While recording, render only overlapping opaque disks. This preserves a
      // continuous visual stroke at very low cost; the physical hairs are rebuilt later.
      const radius = ROOT_RADIUS * brushSettings.thickness * (.10 + brush.pressure * .90);
      if (!previewReady) { previewX = x; previewY = y; previewReady = true; }
      const dx = x - previewX, dy = y - previewY;
      const distance = Math.hypot(dx, dy);
      const stepSize = Math.max(.8, radius * .45);
      const steps = Math.max(1, Math.ceil(distance / stepSize));
      ctx.fillStyle = ink; ctx.globalAlpha = 1;
      for (let step = 1; step <= steps; step++) {
        const ratio = step / steps;
        ctx.beginPath();
        ctx.arc(previewX + dx * ratio, previewY + dy * ratio, Math.max(.5, radius), 0, Math.PI * 2);
        ctx.fill();
      }
      previewX = x; previewY = y;
    }
    function setBrushHeight(inputPressure, speed, now = performance.now()) {
      // Pressure/contact area already produce a nonlinear value.  A second curve
      // makes a light touch visibly finer, while speed lifts the whole brush.
      const contactPressure = Math.pow(inputPressure, 1.35);
      // Normal writing speed retains a firm entry; only genuinely fast flicks lift.
      const speedSensitivity = brushSettings.speedThinness;
      const speedThreshold = 1.05 - speedSensitivity * .80;
      // Speed should suggest lifting, not instantly pull the whole bundle off
      // the paper.  A curved response preserves contact at ordinary flick speed.
      const speedExcess = Math.max(0, speed - speedThreshold);
      const speedLift = Math.min(.56,
        Math.pow(speedExcess, 1.65) * (.08 + speedSensitivity * .54));
      brush.sensorPressure = contactPressure * (1 - speedLift);
      // A deliberate one-second settling makes the start of every stroke soft.
      const entry = Math.max(0, Math.min(1, (now - brush.startedAt) / 1000));
      brush.pressure = brush.sensorPressure * entry;
      brush.rootZ = rootHeightForPressure(brush.pressure);
    }
    function reportContact(sample, size, areaPressure) {
      const f = (value, digits) => Number(value).toFixed(digits);
      contactCells[0].textContent = f(sample.width, 1) + ' x ' + f(sample.height, 1);
      contactCells[1].textContent = f(size, 1) + ' > ' + f(smoothSize, 1);
      contactCells[2].textContent = f(contactMin, 0) + ' - ' + f(contactMax, 0);
      contactCells[3].textContent = f(areaPressure, 2);
      contactCells[4].textContent = f(brush.pressure, 2);
      contactCells[5].textContent = f(sample.pressure, 2) + (brush.nativePressureSeen ? ' 使用' : ' 未使用');
    }

    function advancePointerSample(sample) {
      const size = contactSize(sample);
      if (size === null) return;
      const dx = sample.clientX - brush.inputX, dy = sample.clientY - brush.inputY;
      const distance = Math.hypot(dx, dy);
      const elapsed = Math.max(1, sample.timeStamp - brush.inputTime);
      const speed = distance / elapsed; // CSS pixels per millisecond
      const inputPressure = pressureFromContact(sample, size);
      setBrushHeight(inputPressure, speed);
      if (showContact) reportContact(sample, size, inputPressure);
      if (distance > .35) {
        const directionX = dx / distance, directionY = dy / distance;
        if (brush.hasDirection && directionX * brush.lastMoveX + directionY * brush.lastMoveY < .72) {
          brush.turnStrength = 1;
        }
        if (!brush.hasDirection) {
          brush.dirX = directionX; brush.dirY = directionY; brush.hasDirection = true;
          // No ink has been deposited yet, so establish the inclined rest shape now.
          resetBristles();
        } else {
          // A soft viscous bundle changes orientation slowly at a corner.
          brush.dirX += (directionX - brush.dirX) * .075;
          brush.dirY += (directionY - brush.dirY) * .075;
          const length = Math.hypot(brush.dirX, brush.dirY) || 1;
          brush.dirX /= length; brush.dirY /= length;
        }
        brush.lastMoveX = directionX; brush.lastMoveY = directionY;
        brush.drawEnabled = true;
      }

      // Drive physics by travelled distance in both live and replay modes.
      // At the old 2.5px spacing a fast event could move the roots farther than
      // the wet tips could follow, briefly leaving no hair on the paper and
      // producing gaps only in the final replay.
      const steps = Math.max(1, Math.ceil(distance / .85));
      for (let step = 1; step <= steps; step++) {
        const ratio = step / steps;
        brush.x = brush.inputX + dx * ratio;
        brush.y = brush.inputY + dy * ratio;
        recordBrushState(brush.inputTime + elapsed * ratio);
        if (brushSettings.finalRecompute) drawFastPreview(brush.x, brush.y);
        else simulate();
      }
      brush.inputX = sample.clientX; brush.inputY = sample.clientY; brush.inputTime = sample.timeStamp;
    }
    // There is deliberately no animation loop.  Physics is advanced by the
    // distance-interpolated PointerEvents; an extra simulation per frame made live
    // mode denser than replay, and an empty rAF loop only burned battery.

    canvas.addEventListener('pointerdown', e => {
      if (matchMedia('(orientation: landscape)').matches) return;
      if (isClearCorner(e)) {
        clearTimer = setTimeout(() => {
          clearTimer = 0;
          settingsPanel.hidden = false;
          notice.classList.add('hide');
        }, 700);
        return;
      }
      if (!settingsPanel.hidden) { settingsPanel.hidden = true; return; }
      const size = contactSize(e);
      if (size === null || (e.pointerType !== 'touch' && e.pointerType !== 'pen')) {
        say('接触面の幅・高さを取得できる端末でお使いください', 2600); return;
      }
      canvas.setPointerCapture(e.pointerId);
      activePointer = e.pointerId;
      brush.x = e.clientX; brush.y = e.clientY; brush.nativePressureSeen = false;
      brush.inputX = e.clientX; brush.inputY = e.clientY; brush.inputTime = e.timeStamp;
      brush.dirX = 0; brush.dirY = -1; brush.hasDirection = false;
      brush.startedAt = performance.now(); brush.releasing = false;
      brush.lastMoveX = 0; brush.lastMoveY = 1;
      brush.turnStrength = 0;
      brush.inkTaper = 1;
      previewX = brush.x; previewY = brush.y; previewReady = false;
      setBrushHeight(pressureFromContact(e, size, true), 0);
      brush.active = true; brush.drawEnabled = false;
      // With recompute off nothing is ever replayed, so skip the full-canvas copy
      // and the per-step recording entirely: live mode must stay as light as possible.
      if (brushSettings.finalRecompute) beginStrokeHistory(e.timeStamp);
      resetBristles();
      say('毛の物理計算で描画中', 1050);
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('pointermove', e => {
      if (clearTimer) { if (!isClearCorner(e)) cancelClear(); return; }
      if (!brush.active || activePointer !== e.pointerId) return;
      const coalesced = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [];
      const packets = coalesced.length ? coalesced : [e];
      for (const packet of packets) advancePointerSample(packet);
      e.preventDefault();
    }, { passive: false });
    function endPointer(e) {
      cancelClear();
      if (activePointer === e.pointerId) {
        activePointer = null;
        saveContactRange();
        // Off means off: the live hair rendering is final.  A harai taper can only
        // be built once the stroke has ended, so it belongs to the recompute path.
        if (e.type === 'pointerup' && brush.drawEnabled && brushSettings.finalRecompute) {
          brush.active = false;
          calculateFinalStroke(brushSettings.haraiDuration);
        } else {
          brush.active = false; brush.drawEnabled = false;
          if (e.type === 'pointercancel' && brushSettings.finalRecompute && snapshotValid) {
            drawLayerToCanvas();
          }
          discardStrokeHistory();
        }
      }
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('contextmenu', e => e.preventDefault());
  })();
  </script>
</body>
</html>
